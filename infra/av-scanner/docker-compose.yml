services:
  clamav:
    image: clamav/clamav:1.3
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 3

  scanner-api:
    build: ./scanner-api
    restart: unless-stopped
    depends_on:
      - clamav
    environment:
      CLAMD_HOST: clamav
      CLAMD_PORT: '3310'
      SCANNER_SHARED_SECRET: ${SCANNER_SHARED_SECRET}
    ports:
      - '8080:8080'

volumes:
  clamav-data:
