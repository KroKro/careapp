<section class="mx-auto max-w-3xl">
  <app-wizard-progress [currentStep]="2" title="Kognitive und kommunikative Fähigkeiten" />

  <div class="card space-y-4">
    <p class="alert-info">
      Hinweis: Auch wenn hier keine Beeinträchtigungen vorliegen, fülle bitte auch Modul 3 aus –
      es zählt jeweils nur der höhere der beiden Werte.
    </p>

    <app-level-question-group
      [questions]="questions"
      [scaleLabels]="scaleLabels"
      [form]="form"
      [explanations]="explanations"
    />

    <app-module-score-summary [rawScore]="rawScore()" [weightedScore]="weightedScore()" [stepTable]="stepTable()" />

    <div class="flex items-center justify-between pt-2">
      <button type="button" class="link text-sm" (click)="cancel()">Abbrechen</button>
      <div class="flex items-center gap-3">
        <button type="button" class="btn-secondary" (click)="goBack()">Zurück</button>
        <button type="button" class="btn-primary" [disabled]="saving()" (click)="submit()">
          @if (saving()) {
            <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 0 1 8-8V0C5.373 0 0 5.373 0 12h4Z" />
            </svg>
          }
          Weiter zu Modul 3
        </button>
      </div>
    </div>
  </div>
</section>
