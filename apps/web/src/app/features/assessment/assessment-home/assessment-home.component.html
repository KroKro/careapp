<div class="mx-auto max-w-3xl">
  <h1 class="text-2xl font-semibold text-gray-800 dark:text-white">Pflegegrad-Einschätzung</h1>
  <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
    Schätze in sechs kurzen Abschnitten deine Selbständigkeit ein — genau die Bereiche, die auch
    bei der offiziellen Begutachtung nach § 15 SGB XI geprüft werden.
  </p>

  <div class="card mt-6">
    <div class="flex flex-col items-start gap-4 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <h2 class="text-lg font-semibold text-gray-800 dark:text-white">Neue Einschätzung</h2>
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
          Dauert etwa 15–20 Minuten. Du kannst jederzeit unterbrechen und später fortsetzen.
        </p>
      </div>
      <button type="button" class="btn-primary shrink-0" [disabled]="starting()" (click)="startOrResume()">
        Einschätzung starten / fortsetzen
      </button>
    </div>
  </div>
</div>
