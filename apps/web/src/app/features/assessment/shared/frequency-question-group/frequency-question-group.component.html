<div [formGroup]="form" class="space-y-3">
  @for (question of questions; track question.id) {
    <div
      [formGroupName]="question.id"
      class="rounded-xl border border-gray-200 p-4 dark:border-gray-800"
    >
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div class="flex items-start gap-2">
          <p class="text-sm font-medium text-gray-700 dark:text-gray-300">{{ question.label }}</p>
          @if (explanations?.[question.id]) {
            <button
              type="button"
              class="inline-flex shrink-0 items-center rounded-md p-1 text-brand-500 hover:bg-brand-50 hover:text-brand-600 dark:text-brand-400 dark:hover:bg-brand-500/10"
              [attr.aria-expanded]="expandedIds().has(question.id)"
              [attr.aria-label]="(expandedIds().has(question.id) ? 'Erläuterung ausblenden: ' : 'Erläuterung anzeigen: ') + question.label"
              (click)="toggleExplanation(question.id)"
            >
              <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M11.25 11.25l.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z"
                />
              </svg>
            </button>
          }
        </div>
        <div class="flex gap-3">
          <label class="flex flex-col gap-1 text-xs text-gray-500 dark:text-gray-400">
            pro Tag
            <input type="number" min="0" step="1" class="input w-20! py-1.5!" formControlName="perDay" />
          </label>
          <label class="flex flex-col gap-1 text-xs text-gray-500 dark:text-gray-400">
            pro Woche
            <input type="number" min="0" step="1" class="input w-20! py-1.5!" formControlName="perWeek" />
          </label>
          <label class="flex flex-col gap-1 text-xs text-gray-500 dark:text-gray-400">
            pro Monat
            <input type="number" min="0" step="1" class="input w-20! py-1.5!" formControlName="perMonth" />
          </label>
        </div>
      </div>

      @if (expandedIds().has(question.id) && explanations?.[question.id]; as exp) {
        <p class="mt-3 whitespace-pre-line rounded-lg bg-gray-50 p-3 text-xs leading-relaxed text-gray-600 dark:bg-gray-800/60 dark:text-gray-400">
          {{ exp.definition }}
        </p>
      }
    </div>
  }
</div>
