<div class="mb-6">
  <div class="mb-2 flex items-center justify-between text-sm font-medium text-gray-500 dark:text-gray-400">
    <span>Schritt {{ currentStep }} von {{ totalSteps }}</span>
  </div>
  <div class="h-2 w-full overflow-hidden rounded-full bg-gray-100 dark:bg-gray-800">
    <div
      class="h-full rounded-full bg-brand-500 transition-all duration-300"
      [style.width.%]="(currentStep / totalSteps) * 100"
    ></div>
  </div>
  <h1 class="mt-4 text-2xl font-semibold text-gray-800 dark:text-white">{{ title }}</h1>
</div>
