<div class="flex min-h-screen items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="mb-8 text-center">
      <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-xl bg-brand-500 text-xl font-semibold text-white">
        P
      </div>
      <h1 class="text-2xl font-semibold text-gray-800 dark:text-white">Neues Passwort festlegen</h1>
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Pflegegrad-Einschätzung</p>
    </div>

    <div class="card">
      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
        <div>
          <label class="label">Neues Passwort (mind. 8 Zeichen)</label>
          <input type="password" class="input" formControlName="password" autocomplete="new-password" />
        </div>

        @if (errorMessage()) {
          <p class="alert-error">{{ errorMessage() }}</p>
        }

        <button type="submit" class="btn-primary w-full" [disabled]="submitting()">Passwort speichern</button>
      </form>
    </div>
  </div>
</div>
