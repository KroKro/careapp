<section class="mx-auto max-w-3xl">
  <h1 class="text-2xl font-semibold text-gray-800 dark:text-white">Kapitel 3: Pflegebegründende Diagnose(n)</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" class="card mt-6 space-y-5">
    <div>
      <div class="mb-2 flex items-center justify-between">
        <span class="label mb-0">Diagnosen</span>
        <button type="button" class="btn-secondary px-3! py-1.5! text-xs" (click)="addDiagnose()">+ Diagnose hinzufügen</button>
      </div>
      <div [formArrayName]="'diagnosen'" class="space-y-3">
        @for (d of diagnosen.controls; track d; let i = $index) {
          <div [formGroupName]="i" class="grid gap-3 rounded-lg border border-gray-200 p-3 sm:grid-cols-[1fr_auto_auto] dark:border-gray-800">
            <input type="text" class="input" placeholder="Diagnosebezeichnung" formControlName="bezeichnung" />
            <input type="text" class="input sm:w-32" placeholder="ICD-10-Code" formControlName="icdCode" />
            <button type="button" class="btn-ghost text-xs" (click)="removeDiagnose(i)">Entfernen</button>
          </div>
        }
      </div>
    </div>

    <div>
      <label class="label">Weitere Diagnosen</label>
      <textarea class="input" rows="4" formControlName="weitereDiagnosen"></textarea>
    </div>

    <div class="flex items-center justify-between pt-2">
      <a routerLink="/gutachten" class="link text-sm">Abbrechen</a>
      <div class="flex items-center gap-3">
        <button type="button" class="btn-secondary" (click)="goBack()">Zurück</button>
        <button type="submit" class="btn-primary" [disabled]="saving()">
          @if (saving()) {
            <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 0 1 8-8V0C5.373 0 0 5.373 0 12h4Z" />
            </svg>
          }
          Weiter zu Modul 1
        </button>
      </div>
    </div>
  </form>
</section>
