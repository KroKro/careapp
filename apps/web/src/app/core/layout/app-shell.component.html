<div class="min-h-screen bg-gray-50 dark:bg-gray-950">
  @if (sidebarOpen()) {
    <div class="fixed inset-0 z-40 bg-gray-900/50 lg:hidden" (click)="sidebarOpen.set(false)"></div>
  }

  <aside
    class="fixed inset-y-0 left-0 z-50 w-72 border-r border-gray-200 bg-white transition-transform duration-200 dark:border-gray-800 dark:bg-gray-900 lg:translate-x-0"
    [class]="sidebarOpen() ? 'translate-x-0' : '-translate-x-full'"
  >
    <div class="flex h-16 items-center px-6">
      <img src="logo.png" alt="Der QM-Berater" class="h-12 w-auto" />
    </div>

    <nav class="mt-2 space-y-1 px-4">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive
          #rla="routerLinkActive"
          [class]="
            rla.isActive
              ? 'flex items-center gap-3 rounded-lg bg-brand-50 px-3 py-2.5 text-sm font-medium text-brand-600 dark:bg-brand-500/15 dark:text-brand-400'
              : 'flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-gray-600 transition hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-800'
          "
        >
          <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
          </svg>
          {{ item.label }}
        </a>
      }
      @if (auth.role() === 'admin') {
        <a
          [routerLink]="adminNavItem.path"
          routerLinkActive
          #rlaAdmin="routerLinkActive"
          [class]="
            rlaAdmin.isActive
              ? 'flex items-center gap-3 rounded-lg bg-brand-50 px-3 py-2.5 text-sm font-medium text-brand-600 dark:bg-brand-500/15 dark:text-brand-400'
              : 'flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-gray-600 transition hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-800'
          "
        >
          <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="adminNavItem.icon" />
          </svg>
          {{ adminNavItem.label }}
        </a>
      }
    </nav>
  </aside>

  <div class="lg:pl-72">
    <header
      class="sticky top-0 z-30 flex h-16 items-center justify-between gap-4 border-b border-gray-200 bg-white px-4 dark:border-gray-800 dark:bg-gray-900 sm:px-6"
    >
      <button type="button" class="text-gray-600 lg:hidden dark:text-gray-300" (click)="sidebarOpen.set(true)">
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" />
        </svg>
      </button>

      <div class="flex-1"></div>

      <div class="flex items-center gap-3">
        <button
          type="button"
          class="flex h-9 w-9 items-center justify-center rounded-lg text-gray-500 transition hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800"
          (click)="theme.toggle()"
          [attr.aria-label]="theme.isDark() ? 'Helles Design' : 'Dunkles Design'"
        >
          @if (theme.isDark()) {
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
              />
            </svg>
          } @else {
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
              />
            </svg>
          }
        </button>

        <span class="hidden text-sm text-gray-600 sm:block dark:text-gray-300">{{ auth.session()?.user?.email }}</span>

        <button type="button" class="btn-secondary px-3! py-1.5! text-xs" (click)="signOut()">Abmelden</button>
      </div>
    </header>

    <main class="p-4 sm:p-6 lg:p-8">
      <router-outlet />
    </main>
  </div>
</div>
